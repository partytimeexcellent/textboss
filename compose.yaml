# TextBoss
#
# Behind an existing reverse proxy (Pangolin, Traefik, nginx...):
#   docker compose up -d
#   then point the proxy at this host on the PORT set in .env (default 3000).
#   No ports 80/443 needed here.
#
# Standalone with Caddy for automatic HTTPS (needs a DNS record for DOMAIN
# pointing here and ports 80/443 open):
#   docker compose --profile caddy up -d

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      PORT: "3000" # inside the container; the host port comes from PORT in .env
    volumes:
      - textboss-data:/app/data
    ports:
      - "${PORT:-3000}:3000"

  caddy:
    image: caddy:2.8-alpine
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  textboss-data:
  caddy-data:
  caddy-config:
